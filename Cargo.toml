[package]
name = "kiln"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
description = "Fast desktop background remover plus template merger. Drop images in, get transparent PNGs out."
repository = "https://github.com/DevM0B1US/kiln"

[dependencies]
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tga",
    "tiff",
    "webp",
] }
thiserror = "2"
tracing = "0.1"
ndarray = "0.17"
sha2 = "0.10"
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-27",
] }
eframe = "0.37"
egui = "0.37"
rfd = "0.17"
arboard = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
