[workspace]
resolver = "2"
members = ["crates/kiln-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/DevM0B1US/kiln"

[profile.dev]
# Debuginfo dominates the artifact tree; the headless CLI plus tests are the
# sandbox verification path, so line tables are enough there.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
