[package]
name = "ember-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga", "tiff", "webp"] }
thiserror = "2"
tracing = "0.1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-27",
] }
ndarray = "0.17"
sha2 = "0.10"
